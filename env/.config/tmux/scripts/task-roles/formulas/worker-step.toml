# Routes a worker step report (C4). Code runs the checks and the route rules;
# Jev answers the three questions. Jev never routes a privileged step: a `never`
# word in needs_decision always routes to ask_user (task-decide.py).
formula = "worker-step"
version = 1
expect_exit = 0                 # every report check must exit with this
never = ["merge", "push", "deploy", "install"]

[decision]
provider = "openrouter"
model = "~typesafe/jev-latest"  # user decision 2026-10-15: alias, not pinned
# The resolved response model must be one of these (ZDR listing, 2026-10-15),
# or the step escalates.
allowed_models = ["typesafe/jev-1.14-20261014", "typesafe/jev-1.13-20260917"]
zdr = true
only = ["typesafe"]

[[steps]]
id = "worker-step"
checks = []                     # extra {cmd, expect_exit} the report must contain

[[steps.questions]]
key = "touches_contract"
type = "noul"
instructions = "Does this step change or depend on a cross-repo contract (C1-C5 in AGENTS.md): a file, path, payload, or name that another repo reads? (state: files_changed, summary)"
criteria = { true = "changes or relies on a contract file, path, payload, or name", false = "internal to one repo, or research only" }
reads = ["files_changed", "summary"]
band = [0.35, 0.65]
route_if_true = "escalate"
route_if_false = "continue"

[[steps.questions]]
key = "needs_user"
type = "noul"
instructions = "Must the user decide or approve something before the next step, including any privileged request (deploy, install, merge, push)? (state: needs_decision, risks)"
criteria = { true = "a decision, approval, or privileged request is pending", false = "no decision pending; the next step can proceed" }
reads = ["needs_decision", "risks"]
band = [0.35, 0.65]
route_if_true = "ask_user"
route_if_false = "continue"

[[steps.questions]]
key = "next_owner"
type = "choice"
instructions = "Which role should act next? (state: needs_decision, summary)"
criteria = { worker = "a repo worker continues or fixes its step", researcher = "external facts or context repos are needed", orchestrator = "review, plan, contract, or privileged step", none = "no next step" }
reads = ["needs_decision", "summary"]
min_confidence = 0.6
on_low_confidence = "escalate"
routes = { worker = "continue", none = "continue", researcher = "escalate", orchestrator = "escalate" }
